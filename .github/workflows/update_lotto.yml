name: Lotto Auto Update

on:
  schedule:
    # 토요일 23:00 KST
    - cron: '0 14 * * 6'
    # 토요일 23:30 KST
    - cron: '30 14 * * 6'
    # 일요일 00:00 KST (UTC 기준 토요일 15:00)
    - cron: '0 15 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies Install
        run: pip install requests beautifulsoup4

      - name: Run Update Script
        run: python update_lotto.py

      - name: Commit and Push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: update lotto numbers"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      # 실제로 새 커밋이 푸시됐을 때만 jsDelivr CDN 캐시를 강제로 비워서,
      # lotto-iq(통계앱)/lotto-widget(위젯앱)이 다음 요청부터 바로 최신 회차를 받도록 함.
      # 변경 없이 스킵된 실행에서는 불필요한 purge 호출을 하지 않음.
      - name: Purge jsDelivr Cache
        if: steps.commit.outputs.pushed == 'true'
        run: |
          curl -s "https://purge.jsdelivr.net/gh/trotcodi-ui/2025lotto@main/2025lotto_numbers_1_to_1182_final.json"
